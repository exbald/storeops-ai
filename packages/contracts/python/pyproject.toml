[project]
name = "storeops-contracts"
version = "2.0.0"
description = "StoreOps generated Python contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storeops_contracts"]
